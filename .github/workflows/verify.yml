name: Verify Shattered Ages

on:
  pull_request:
    branches: [main]
  push:
    branches: [shattered-ages-phase-0]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run verify
