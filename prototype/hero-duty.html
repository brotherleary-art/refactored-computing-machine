<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shattered Ages — Hero Duty</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0d0f0d;color:#f3eadc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#1e211a,#0b0c0a);min-height:100vh}.shell{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.top a{color:#dfc28f;text-decoration:none;margin-left:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.card{border:1px solid #5a4e3b;border-radius:18px;padding:16px;background:#151612}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-weight:900}.ready{color:#9fd498}.busy{color:#e0b46f}.recover{color:#dc8f83}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:9px 11px;background:#c9a56b;color:#17130e;font-weight:800;cursor:pointer}button.secondary{background:#7e6a83;color:#fff}button:disabled{opacity:.4}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><div><small>ASHFALL COMMAND • PERSONNEL</small><h1>Hero Duty Board</h1><p>One hero cannot scout, fight, explore and recover at the same time. Civilization has finally discovered calendars.</p></div><div><a href="heroes.html">← Heroes</a><a href="index.html">Settlement</a></div></div><section class="grid" id="grid"></section></main><script>const KEY='shattered-ages-hero-duty-v1',heroes=['Sera Vale','Orin Thess','Mara Keln','Ilya Ren'];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}function render(){const now=Date.now(),state=load(),grid=document.getElementById('grid');grid.innerHTML='';for(const name of heroes){const h=state[name]||{assignment:'idle',woundedUntil:0},recovering=h.woundedUntil>now,status=recovering?'Recovering':h.assignment==='idle'?'Ready':h.assignment,cls=recovering?'recover':h.assignment==='idle'?'ready':'busy',left=recovering?Math.ceil((h.woundedUntil-now)/1000):0,card=document.createElement('article');card.className='card';card.innerHTML=`<div class="row"><h2>${name}</h2><span class="status ${cls}">${status}${left?` • ${left}s`:''}</span></div><p>${recovering?'Unavailable until treatment completes.':h.assignment==='idle'?'Available for field duty.':`Assigned to ${h.assignment}.`}</p><div class="actions"><button data-a="scouting">Scout</button><button data-a="ruin">Ruin</button><button data-a="combat">Combat</button><button class="secondary" data-a="idle">Release</button><button class="secondary" data-a="wound">Simulate Injury</button></div>`;card.querySelectorAll('button').forEach(b=>{if(recovering&&b.dataset.a!=='idle')b.disabled=true;b.onclick=()=>{const s=load(),cur=s[name]||{assignment:'idle',woundedUntil:0};if(b.dataset.a==='wound'){cur.assignment='recovering';cur.woundedUntil=Date.now()+30000}else if(b.dataset.a==='idle'){cur.assignment=cur.woundedUntil>Date.now()?'recovering':'idle';if(cur.woundedUntil<=Date.now())cur.woundedUntil=0}else if(cur.woundedUntil<=Date.now()&&cur.assignment==='idle'){cur.assignment=b.dataset.a}s[name]=cur;save(s);render()}});grid.appendChild(card)}}render();setInterval(render,1000);</script></body></html>
