<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shattered Ages — Expedition Loadout</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0e0d10;color:#f1e9dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2d2332,#0b0b0e 58%);min-height:100vh}.shell{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{color:#dbc5ef;text-decoration:none;margin-left:10px}.wallet,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{border:1px solid #5b4a65;background:#17141b;border-radius:18px;padding:14px}.supply{border:1px solid #51445b;border-radius:16px;padding:14px;background:#131116}.supply input{width:70px;background:#0c0b0e;color:#fff;border:1px solid #6a5a75;border-radius:8px;padding:8px}.summary{border:1px solid #75627f;border-radius:18px;padding:16px;background:#1c1720}.go{border:0;border-radius:12px;padding:12px 16px;background:#b899cf;color:#17111c;font-weight:900;cursor:pointer}.go:disabled{opacity:.45}.ok{color:#9ed39b}.bad{color:#e29387}@media(max-width:700px){.wallet,.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="shell"><div class="top"><div><small>ERA I • EXPEDITION PREPARATION</small><h1>Buried Meridian Loadout</h1></div><div class="nav"><a href="ruin.html">← Ruin</a><a href="index.html">Ashfall Hold</a></div></div><div class="wallet" id="wallet"></div><section class="grid"><label class="supply"><b>Rations</b><p>1 slot • 12 Food</p><input id="rations" type="number" min="0" max="9" value="1"></label><label class="supply"><b>Rope</b><p>1 slot • 8 Timber</p><input id="rope" type="number" min="0" max="9" value="1"></label><label class="supply"><b>Lantern Oil</b><p>1 slot • 4 Clay + 2 Iron</p><input id="lanternOil" type="number" min="0" max="9" value="1"></label><label class="supply"><b>Medical Kit</b><p>2 slots • 8 Food + 6 Clay</p><input id="medicalKit" type="number" min="0" max="9" value="0"></label></section><section class="summary"><h2>Pack Summary</h2><p id="slots"></p><p id="cost"></p><p id="status"></p><button class="go" id="commit">Commit Loadout</button></section></main><script type="module">import{loadState,saveState}from'./state.js';const ids=['rations','rope','lanternOil','medicalKit'],slotCost={rations:1,rope:1,lanternOil:1,medicalKit:2};function values(){return Object.fromEntries(ids.map(id=>[id,Math.max(0,Number(document.getElementById(id).value)||0)]))}function calc(){const s=loadState(),v=values(),slots=Object.entries(v).reduce((n,[k,q])=>n+slotCost[k]*q,0),cost={food:v.rations*12+v.medicalKit*8,timber:v.rope*8,clay:v.lanternOil*4+v.medicalKit*6,iron:v.lanternOil*2},capacity=6,ok=slots<=capacity&&Object.entries(cost).every(([k,n])=>s[k]>=n);document.getElementById('wallet').innerHTML=['food','timber','clay','iron'].map(k=>`<div class="card"><small>${k.toUpperCase()}</small><h2>${s[k]}</h2></div>`).join('');document.getElementById('slots').textContent=`Capacity: ${slots} / ${capacity} slots`;document.getElementById('cost').textContent=`Cost: ${cost.food} Food • ${cost.timber} Timber • ${cost.clay} Clay • ${cost.iron} Iron`;const status=document.getElementById('status');status.className=ok?'ok':'bad';status.textContent=ok?'Loadout ready.':'Too heavy or insufficient settlement resources.';document.getElementById('commit').disabled=!ok;return{s,v,cost,slots,ok}}ids.forEach(id=>document.getElementById(id).oninput=calc);document.getElementById('commit').onclick=()=>{const{x,...rest}=calc(),r=rest; if(!r.ok)return;for(const[k,n]of Object.entries(r.cost))r.s[k]-=n;r.s.expedition.loadout=r.v;r.s.expedition.supplies=Math.max(1,Object.values(r.v).reduce((a,b)=>a+b,0));saveState(r.s);calc();document.getElementById('status').textContent='Loadout committed to the expedition.'};calc();</script></body></html>
