<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Shattered Ages — Field Battle</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b0d0b;color:#f6ead7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#2c281f,#0d0e0d 58%)}.shell{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.back{color:#f4d39b;text-decoration:none;border:1px solid #6e583c;border-radius:999px;padding:8px 12px}.battlefield{margin-top:16px;border:1px solid #6d5840;border-radius:24px;padding:18px;background:linear-gradient(145deg,#242019,#151614);box-shadow:inset 0 0 70px #0008}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}.side{border:1px solid #544637;border-radius:18px;padding:16px;background:#171714}.enemy{border-color:#8e4d49}.player{border-color:#70865f}.big{font-size:34px;font-weight:900}.muted{opacity:.68}.vs{display:flex;align-items:center;font-weight:900;color:#c8a26d}.meter{height:10px;border-radius:99px;background:#302b24;overflow:hidden;margin-top:10px}.meter span{height:100%;display:block;background:#a95c55}.player .meter span{background:#7ea46c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.fight{border:0;border-radius:12px;padding:11px 14px;background:#b35d54;color:white;font-weight:900;cursor:pointer}.fight:disabled{opacity:.5}.card{margin-top:14px;border:1px solid #544637;border-radius:16px;padding:14px;background:#141412}.reward{color:#d9c3e8}.victory{color:#9bc17f}.defeat{color:#d18478}.log{font-size:14px;line-height:1.6}@media(max-width:700px){.versus{grid-template-columns:1fr}.vs{justify-content:center}.big{font-size:28px}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><div class="muted">ASHFALL MARCH • FIELD ENCOUNTER</div><h1 id="title" style="margin:3px 0">Hostile Site</h1></div><a class="back" href="world.html">← World Map</a></div>
<section class="battlefield">
<div class="versus">
<div class="side player"><div class="muted">ASHFALL FIELD FORCE</div><div class="big" id="playerForces">0</div><div>surviving troops</div><div class="meter"><span id="playerMeter"></span></div><p>Commander: <b id="hero"></b></p></div>
<div class="vs">VS</div>
<div class="side enemy"><div class="muted" id="enemyName">HOSTILE FORCE</div><div class="big" id="enemyForces">0</div><div>enemy troops</div><div class="meter"><span id="enemyMeter"></span></div><p>Danger: <b id="danger"></b></p></div>
</div>
<div class="actions"><button class="fight" id="fight">Resolve Battle</button><a class="back" href="index.html">Return to Ashfall Hold</a></div>
</section>
<section class="card"><b>Battle Result</b><p id="result" class="muted">Select a hostile site on the world map and scout it before committing troops.</p><div class="reward" id="reward"></div></section>
<section class="card"><b>Field Log</b><div class="log" id="log"></div></section>
</main>
<script type="module">
import {loadState,resolveWorldBattle} from './state.js';
let state=loadState();
const defs={
'broken-pike-camp':{name:'Broken Pike Camp',enemy:'Broken Pike Raiders',danger:'1/5',reward:'30 Food • 20 Timber • 8 Iron • +2 Power'},
'grey-banner-patrol':{name:'Grey Banner Patrol',enemy:'Grey Banner Patrol',danger:'2/5',reward:'22 Food • 18 Stone • 12 Iron • +3 Power'}
};
const title=document.getElementById('title'),enemyName=document.getElementById('enemyName'),playerForces=document.getElementById('playerForces'),enemyForces=document.getElementById('enemyForces'),hero=document.getElementById('hero'),danger=document.getElementById('danger'),result=document.getElementById('result'),reward=document.getElementById('reward'),log=document.getElementById('log'),fight=document.getElementById('fight');
function render(){
 state=loadState();const id=state.worldBattles.selected,def=defs[id],battle=id?state.worldBattles[id]:null;
 if(!def||!battle){fight.disabled=true;result.textContent='No hostile site is selected. Return to the world map and scout Broken Pike Camp or Grey Banner Patrol.';return}
 title.textContent=def.name;enemyName.textContent=def.enemy;hero.textContent=state.heroFocus;danger.textContent=def.danger;playerForces.textContent=battle.playerForces;enemyForces.textContent=battle.enemyForces;document.getElementById('playerMeter').style.width=Math.min(100,battle.playerForces/38*100)+'%';document.getElementById('enemyMeter').style.width=Math.min(100,battle.enemyForces/(id==='broken-pike-camp'?19:28)*100)+'%';
 fight.disabled=battle.resolved;fight.textContent=battle.resolved?'Battle Resolved':'Resolve Battle';
 if(battle.resolved){result.className=battle.victory?'victory':'defeat';result.textContent=battle.victory?`${def.name} cleared. The road now belongs to Ashfall patrols.`:`The attack failed. Survivors made it back, but the hostile force remains.`;reward.textContent=battle.victory&&battle.rewardClaimed?`Recovered: ${def.reward}`:''}else{result.className='muted';result.textContent='The Ashfall field force is assembled. Resolve the encounter when ready.';reward.textContent=`Victory reward: ${def.reward}`}
 log.innerHTML='';(battle.log.length?battle.log:['Scouts confirm the hostile position.']).forEach(entry=>{const line=document.createElement('div');line.textContent=entry;log.appendChild(line)});
}
fight.onclick=()=>{state=loadState();const id=state.worldBattles.selected;if(!id)return;resolveWorldBattle(state,id);render()};
render();
</script>
</body>
</html>
