<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Shattered Ages — Ashfall Region Map</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#0d0f0d;color:#f4ead7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#111610,#090b09);min-height:100vh}.shell{max-width:1150px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.back{color:#f4d39b;text-decoration:none;border:1px solid #6e583c;border-radius:999px;padding:8px 12px}.map{position:relative;min-height:680px;border:1px solid #65543f;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 52% 48%,#536246 0 15%,#34452f 16% 31%,#293a30 32% 50%,#1d2d26 51% 68%,#17211d 69%);box-shadow:inset 0 0 100px #0009}.river{position:absolute;left:12%;top:-10%;width:18%;height:120%;border-radius:50%;border-right:20px solid #456d7555;transform:rotate(18deg)}.road{position:absolute;left:45%;top:-15%;width:10%;height:130%;background:#9a7c4a22;transform:rotate(-18deg)}.node{position:absolute;transform:translate(-50%,-50%);border:1px solid #8a714f;background:#171a16e8;border-radius:15px;padding:7px 9px;min-width:92px;text-align:center;font-size:12px;cursor:pointer;box-shadow:0 5px 18px #0008}.node:hover{scale:1.06}.settlement{border-color:#e1b86e;background:#3c2b1c}.resource{border-color:#6e9a61}.enemy{border-color:#a95c55}.ruin{border-color:#9b7dc5}.landmark{border-style:dashed}.fog{filter:grayscale(.6);opacity:.5}.panel{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #584a38;background:#151813;border-radius:16px;padding:14px}.legend span{display:inline-block;margin:4px 8px 4px 0;padding:5px 8px;border:1px solid #584a38;border-radius:999px;font-size:12px}@media(max-width:760px){.map{min-height:760px}.node{min-width:76px;font-size:10px;padding:6px}.panel{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><div style="opacity:.65">ERA I: EMBERS • STARTING REGION</div><h1 style="margin:3px 0">Ashfall March</h1></div><a class="back" href="index.html">← Ashfall Hold</a></div>
    <section class="map" id="map"><div class="river"></div><div class="road"></div></section>
    <section class="panel">
      <div class="card"><b id="title">Scout Report</b><p id="detail">Select a location. Nearby sites are safer; distant ruins and hostile camps require stronger parties.</p></div>
      <div class="card legend"><b>Map Key</b><br><span>🏰 Settlement</span><span>🌲 Resource</span><span>⚔ Enemy</span><span>◈ Ruin</span><span>◇ Landmark</span></div>
    </section>
  </main>
<script>
const locations=[
['Ashfall Hold','settlement',50,50,0],['Greenwake Grove','resource',42,48,0],['Lowfield','resource',55,43,0],['Splitstone Shelf','resource',62,50,1],['Redbank Cut','resource',47,59,1],['Blackvein Rise','resource',68,57,2],['Broken Pike Camp','enemy',58,62,1],['Grey Banner Patrol','enemy',71,46,2],['The Sunken Watch','ruin',39,65,1],['Vault of Quiet Iron','ruin',76,61,3],['Glassroot Chamber','ruin',31,52,2],['The Buried Meridian','ruin',82,70,4],['Cinder Bridge','landmark',52,70,1],['Old Crown Road','landmark',61,35,1],['Mirror Fen','landmark',34,39,2],['Ash Hound Den','enemy',27,61,2],['Riven Spear Redoubt','enemy',85,43,3],['Northpine Stand','resource',46,27,1],['Hearthmere Farms','resource',66,29,1],['Whitecliff Cut','resource',24,43,2],['Siltwater Bend','resource',73,79,2],['Emberdeep Shaft','resource',91,59,4],['Silent Bell Tower','ruin',19,72,3],['Carrion Road Raiders','enemy',57,84,3],['The Pale Obelisk','landmark',88,82,5]];
const icon={settlement:'🏰',resource:'🌲',enemy:'⚔',ruin:'◈',landmark:'◇'};const map=document.getElementById('map'),title=document.getElementById('title'),detail=document.getElementById('detail');
locations.forEach(([name,type,x,y,danger])=>{const n=document.createElement('button');n.className=`node ${type} ${danger>=4?'fog':''}`;n.style.left=x+'%';n.style.top=y+'%';n.innerHTML=`${icon[type]}<br><b>${name}</b>`;n.onclick=()=>{title.textContent=name;detail.textContent=`${type.toUpperCase()} • Danger ${danger}/5. ${danger===0?'Safe scouting range.':danger<=2?'Suitable for an early expedition.':danger<=3?'Bring trained troops and supplies.':'High-risk site. Current settlement may be underprepared.'}`};map.appendChild(n)});
</script>
</body>
</html>
