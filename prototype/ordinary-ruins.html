<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shattered Ages — Ordinary Ruins</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0c0d;color:#f0e7d7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#29302d,#0b0c0d 62%)}.shell{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.back{color:#d7c89b;text-decoration:none;border:1px solid #59635f;border-radius:999px;padding:8px 12px}.ruins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.ruin{background:#151918;border:1px solid #55605c;border-radius:20px;padding:16px;cursor:pointer}.ruin.active{outline:2px solid #b9a66c}.panel{margin-top:14px;border:1px solid #59635f;background:#111514ee;border-radius:22px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0c0f0e;border:1px solid #3e4844;border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid #80745c;background:#302a21;color:#f5ead6;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.actions button:disabled{opacity:.45}.meter{height:10px;background:#252a28;border-radius:99px;overflow:hidden;margin-top:12px}.meter span{display:block;height:100%;background:#b9a66c}.log{margin-top:12px;display:grid;gap:6px}.line{padding:9px 10px;background:#0d100f;border-left:3px solid #7f8d87;border-radius:4px 10px 10px 4px}.reward{margin-top:12px;padding:12px;border-radius:14px;background:#242114;border:1px solid #8b7c50}@media(max-width:760px){.ruins,.stats{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><div><small>ERA I • FIELD EXPEDITIONS</small><h1>Ordinary Ruins</h1></div><a class="back" href="world.html">← World Map</a></div><div class="ruins" id="ruins"></div><section class="panel"><small id="hero"></small><h2 id="name"></h2><div class="stats"><div class="stat"><small>Supplies</small><b id="supplies">4</b></div><div class="stat"><small>Danger</small><b id="danger">0</b></div><div class="stat"><small>Progress</small><b id="progress">0%</b></div></div><div class="meter"><span id="meter"></span></div><div class="actions"><button data-choice="study">Study the site</button><button data-choice="salvage">Salvage carefully</button><button data-choice="press-on">Press deeper</button></div><div class="reward" id="reward">Complete a ruin to return materials and knowledge to Ashfall Hold.</div><div class="log" id="log"></div></section></main><script type="module">import{loadState,saveState}from'./state.js';
const defs={'ruin-1':{name:'The Sunken Watch',danger:10,reward:{stone:28,knowledge:2}},'ruin-2':{name:'Vault of Quiet Iron',danger:30,reward:{iron:22,knowledge:4}},'ruin-3':{name:'Glassroot Chamber',danger:20,reward:{clay:35,knowledge:3}}};const bias={'Sera Vale':{study:4,salvage:5,press:12},'Orin Thess':{study:8,salvage:7,press:8},'Mara Keln':{study:7,salvage:13,press:6},'Ilya Ren':{study:16,salvage:6,press:4}};let state=loadState();state.ordinaryRuins=state.ordinaryRuins||{};state.knowledge=state.knowledge||0;let selected=new URLSearchParams(location.search).get('ruin')||'ruin-1';if(!defs[selected])selected='ruin-1';function ensure(id){return state.ordinaryRuins[id]||(state.ordinaryRuins[id]={supplies:4,danger:defs[id].danger,progress:0,completed:false,rewardClaimed:false,log:[]})}function choose(choice){const run=ensure(selected);if(run.completed||run.supplies<=0)return;const h=bias[state.heroFocus]||bias['Orin Thess'];const gain=choice==='study'?25+h.study:choice==='salvage'?24+h.salvage:31+h.press;run.supplies--;run.progress=Math.min(100,run.progress+gain);run.danger=Math.max(0,run.danger+(choice==='study'?-4:choice==='salvage'?2:7));run.log.push(`${state.heroFocus} chose ${choice}; progress reached ${run.progress}%.`);if(run.progress>=100){run.completed=true;if(!run.rewardClaimed){run.rewardClaimed=true;for(const[k,v]of Object.entries(defs[selected].reward)){state[k]=(state[k]||0)+v}run.log.push('The expedition returns to Ashfall Hold with recovered knowledge and materials.')}}saveState(state);render()}function render(){document.getElementById('ruins').innerHTML=Object.entries(defs).map(([id,d])=>`<div class="ruin ${id===selected?'active':''}" data-id="${id}"><small>Danger ${d.danger}</small><h3>${d.name}</h3><div>${ensure(id).completed?'CLEARED':'EXPLORE'}</div></div>`).join('');document.querySelectorAll('.ruin').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render()});const run=ensure(selected);document.getElementById('hero').textContent=`Field lead: ${state.heroFocus}`;document.getElementById('name').textContent=defs[selected].name;document.getElementById('supplies').textContent=run.supplies;document.getElementById('danger').textContent=run.danger;document.getElementById('progress').textContent=run.progress+'%';document.getElementById('meter').style.width=run.progress+'%';document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=run.completed||run.supplies<=0;b.onclick=()=>choose(b.dataset.choice)});document.getElementById('reward').textContent=run.completed?'Ruin cleared. Reward transferred to the persistent settlement run.':'Complete a ruin to return materials and knowledge to Ashfall Hold.';document.getElementById('log').innerHTML=(run.log.length?run.log:['No expedition action taken yet.']).map(x=>`<div class="line">${x}</div>`).join('')}render();</script></body></html>
